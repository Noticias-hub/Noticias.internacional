<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias Internacional</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #333;
        }
        h1 {
            margin: 0;
            font-size: 2.2em;
        }
        .noticia {
            background-color: #1a1a1a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border-left: 4px solid #00ff88;
        }
        .fecha {
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <h1>Noticias Internacional</h1>
        <p>Noticias del mundo actualizadas</p>
    </header>

    <div class="noticia">
        <h2>Título de la noticia de ejemplo</h2>
        <p class="fecha">14 de agosto de 2026</p>
        <p>Aquí va el contenido de la noticia. Puedes editar esto más adelante.</p>
    </div>

    <div class="noticia">
        <h2>Otra noticia de ejemplo</h2>
        <p class="fecha">14 de agosto de 2026</p>
        <p>Este es un segundo ejemplo de noticia.</p>
    </div>
</body>
</html>
